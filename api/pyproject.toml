[project]
name = "spruce-api"
version = "0.1.0"
description = "Spruce booking marketplace API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162,<0.163",
  "uvicorn[standard]>=0.54,<0.55",
  "sqlalchemy[asyncio]>=2.1,<2.2",
  "alembic>=1.20,<1.21",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.16,<3",
  "redis>=8.1,<9",
  "argon2-cffi>=25,<26",
  "cryptography>=50.0.2,<51",
  "pyotp>=2.9,<3",
  "email-validator>=2.2,<3",
  "httpx>=0.28,<0.29",
]

[dependency-groups]
dev = [
  "pytest>=9.2,<10",
  "pytest-asyncio>=1.4,<2",
  "httpx>=0.28,<0.29",
  "ruff>=0.17,<0.18",
  "mypy>=2.4,<3",
  "pip-audit>=2.10,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
